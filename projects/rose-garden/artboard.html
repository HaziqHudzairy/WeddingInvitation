<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rose Garden · Artboard</title>
    <style>
      body { margin: 0; padding: 24px; font: 14px/1.4 system-ui, sans-serif; background: #f4efe9; color: #4a3a3f; }
      h1 { font-weight: 500; margin: 0 0 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      figure { margin: 0; padding: 12px; border-radius: 12px; background: #fffdf9 linear-gradient(45deg, #f6efe8 25%, transparent 25%, transparent 75%, #f6efe8 75%) 0 0 / 24px 24px; box-shadow: 0 6px 20px -12px rgba(60, 30, 40, 0.4); }
      figure.wide { grid-column: span 2; }
      img { display: block; width: 100%; height: 240px; object-fit: contain; }
      figure.wide img { height: 380px; }
      figcaption { margin-top: 8px; font-size: 12px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>Generated illustrations (dev only — run <code>npm run art</code> to regenerate)</h1>
    <div class="grid" id="grid"></div>
    <script type="module">
      const files = import.meta.glob('./src/assets/art/*.svg', { eager: true, query: '?url', import: 'default' });
      const grid = document.getElementById('grid');
      // `?f=arch&bg=%23fff` shows a single illustration full-size.
      const params = new URLSearchParams(location.search);
      const only = params.get('f');
      if (only) {
        const url = Object.entries(files).find(([p]) => p.endsWith(`/${only}.svg`))?.[1];
        document.body.innerHTML = `<img src="${url}" alt="" style="display:block;margin:0 auto;max-width:100%;height:calc(100vh - 48px);object-fit:contain" />`;
        document.body.style.background = params.get('bg') ?? '#f7ebe8';
      } else {
        const wide = /(garland|garden|foreground|bush|couple|arch|map)/;
        for (const [path, url] of Object.entries(files).sort()) {
          const name = path.split('/').pop();
          const fig = document.createElement('figure');
          if (wide.test(name)) fig.className = 'wide';
          fig.innerHTML = `<img src="${url}" alt="" /><figcaption>${name}</figcaption>`;
          grid.append(fig);
        }
      }
    </script>
  </body>
</html>
